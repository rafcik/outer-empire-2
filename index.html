<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OE Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a16;--surface:#0c1525;--surface2:#111c35;--border:#1a2a45;
  --text:#b8c8e0;--dim:#46607a;
  --cyan:#00d4ff;--green:#22c55e;--amber:#f5a623;--violet:#9b7cff;--red:#f56565;
}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;min-height:100vh}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 8% 12%,#fff3 0%,transparent 100%),
    radial-gradient(1px 1px at 22% 55%,#fff2 0%,transparent 100%),
    radial-gradient(1px 1px at 38% 28%,#fff2 0%,transparent 100%),
    radial-gradient(1px 1px at 53% 72%,#fff1 0%,transparent 100%),
    radial-gradient(1px 1px at 67% 18%,#fff3 0%,transparent 100%),
    radial-gradient(1px 1px at 79% 88%,#fff2 0%,transparent 100%),
    radial-gradient(1px 1px at 91% 44%,#fff2 0%,transparent 100%),
    radial-gradient(1px 1px at 15% 82%,#fff1 0%,transparent 100%),
    radial-gradient(1px 1px at 44% 95%,#fff2 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 7%,#fff3 0%,transparent 100%);
}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(6,10,22,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:10px;height:46px
}
.logo{font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.06em;white-space:nowrap;margin-right:4px}
.logo span{color:var(--dim);font-weight:400}
.tab-nav{display:flex;flex:1}
.tab-btn{
  padding:0 13px;height:46px;border:none;background:transparent;
  color:var(--dim);font-size:13px;font-weight:500;font-family:inherit;
  cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.hdr-btns{display:flex;gap:5px;flex-shrink:0}

/* ── Buttons ── */
.btn{
  padding:5px 11px;border-radius:5px;border:1px solid;
  font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap
}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--dim)}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-danger{background:transparent;border-color:rgba(245,101,101,.3);color:var(--red)}
.btn-danger:hover{background:rgba(245,101,101,.08)}
.btn-cyan{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.3);color:var(--cyan)}
.btn-cyan:hover{background:rgba(0,212,255,.14)}
.btn-green{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:var(--green)}
.btn-green:hover{background:rgba(34,197,94,.14)}
.icon-btn{
  padding:2px 6px;background:transparent;border:1px solid var(--border);
  color:var(--dim);border-radius:3px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s
}
.icon-btn:hover{color:var(--text);border-color:var(--dim)}
.icon-btn.danger:hover{color:var(--red);border-color:var(--red)}
.icon-btn:disabled{opacity:.25;cursor:not-allowed;pointer-events:none}

/* ── Tabs ── */
.tab-panel{display:none;height:calc(100vh - 46px);position:relative;z-index:1}
.tab-panel.active{display:block}
.panel-layout{display:grid;grid-template-columns:230px 1fr;height:100%}

/* ── Sidebar ── */
.sidebar{
  border-right:1px solid var(--border);padding:11px 9px;
  position:sticky;top:46px;height:calc(100vh - 46px);
  overflow-y:auto;background:rgba(12,21,37,.6)
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.search-input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:7px 9px;border-radius:5px;font-size:12px;
  font-family:inherit;outline:none;margin-bottom:7px
}
.search-input:focus{border-color:var(--cyan)}
.planet-list{list-style:none}
.planet-item{
  padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;
  color:var(--dim);border:1px solid transparent;margin-bottom:2px;transition:all .12s
}
.planet-item:hover{color:var(--text);background:var(--surface2);border-color:var(--border)}
.planet-item.active{color:var(--cyan);background:rgba(0,212,255,.07);border-color:rgba(0,212,255,.2)}
.pi-progress{font-size:10px;color:var(--dim);margin-top:2px}
.planet-item.active .pi-progress{color:rgba(0,212,255,.5)}

/* ── Main scroll area ── */
.main-scroll{overflow-y:auto;height:100%}
.main-scroll::-webkit-scrollbar{width:5px}
.main-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.main-pad{padding:18px 20px;display:flex;flex-direction:column;gap:16px;max-width:900px}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.card-hdr{
  padding:9px 14px;border-bottom:1px solid var(--border);
  background:rgba(17,28,53,.5);display:flex;align-items:center;justify-content:space-between;gap:8px
}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}

/* ── Tables ── */
.btable{width:100%;border-collapse:collapse}
.btable th{
  padding:6px 11px;text-align:left;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;color:var(--dim);border-bottom:1px solid var(--border)
}
.btable td{padding:6px 11px;border-bottom:1px solid rgba(26,42,69,.4);vertical-align:middle}
.btable tr:last-child td{border-bottom:none}
.btable tbody tr:hover td{background:rgba(17,28,53,.5)}
.slot-num{font-family:'Space Mono',monospace;font-size:10px;color:var(--dim);width:28px;text-align:right}
.bname{font-weight:500;font-size:13px}

/* ── Colony status badges ── */
.sbadge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;
  transition:filter .12s;user-select:none;white-space:nowrap
}
.sbadge:hover{filter:brightness(1.15)}
.sbadge.built{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.1)}
.sbadge.building{color:var(--amber);border-color:rgba(245,166,35,.3);background:rgba(245,166,35,.1)}
.sbadge.materials{color:var(--violet);border-color:rgba(155,124,255,.3);background:rgba(155,124,255,.1)}
.sbadge.pending{color:var(--dim);border-color:rgba(70,96,122,.25);background:rgba(70,96,122,.07)}
.sed{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.seb{
  padding:3px 7px;border-radius:4px;border:1px solid var(--border);
  background:var(--surface2);color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s
}
.seb:hover{color:var(--text);border-color:var(--dim)}
.seb.s-pending.act{color:var(--dim);border-color:rgba(70,96,122,.5);background:rgba(70,96,122,.12)}
.seb.s-materials.act{color:var(--violet);border-color:rgba(155,124,255,.4);background:rgba(155,124,255,.1)}
.seb.s-building.act{color:var(--amber);border-color:rgba(245,166,35,.4);background:rgba(245,166,35,.1)}
.seb.s-built.act{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1)}
.time-inp{
  background:var(--surface2);border:1px solid var(--amber);color:var(--amber);
  padding:3px 6px;border-radius:4px;font-size:12px;font-family:'Space Mono',monospace;width:66px;outline:none
}

/* ── Chips ── */
.planet-title{font-size:20px;font-weight:700;color:var(--cyan);text-shadow:0 0 24px rgba(0,212,255,.2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid}
.chip-built{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)}
.chip-building{color:var(--amber);border-color:rgba(245,166,35,.3);background:rgba(245,166,35,.08)}
.chip-pending{color:var(--dim);border-color:rgba(70,96,122,.3);background:rgba(70,96,122,.08)}
.chip-materials{color:var(--violet);border-color:rgba(155,124,255,.3);background:rgba(155,124,255,.08)}

/* ── Forms ── */
.form-row{display:flex;flex-direction:column;gap:3px}
.form-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.form-inp{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 9px;border-radius:5px;font-size:12px;font-family:inherit;outline:none
}
.form-inp:focus{border-color:var(--cyan)}
.qty-inp{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:3px 6px;border-radius:4px;font-size:12px;font-family:'Space Mono',monospace;
  width:68px;outline:none;text-align:right
}
.qty-inp:focus{border-color:var(--cyan)}

/* ── Summary table ── */
.stable{width:100%;border-collapse:collapse}
.stable th{
  padding:7px 14px;text-align:left;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;color:var(--dim);border-bottom:1px solid var(--border)
}
.stable td{padding:7px 14px;border-bottom:1px solid rgba(26,42,69,.4);font-size:12px}
.stable tr:last-child td{border-bottom:none}
.stable tbody tr:hover td{background:rgba(17,28,53,.4)}
.n{font-family:'Space Mono',monospace;font-size:11px;text-align:right}
.n-built{color:var(--green)}.n-building{color:var(--amber)}
.n-materials{color:var(--violet)}.n-pending{color:var(--dim)}

/* ── Empty state ── */
.empty-state{padding:60px 20px;text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-icon{font-size:36px;opacity:.4}

/* ── Import textarea ── */
.import-ta{
  width:100%;height:200px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:10px;border-radius:6px;font-size:12px;
  font-family:'Space Mono',monospace;resize:vertical;outline:none;line-height:1.6
}
.import-ta:focus{border-color:var(--cyan)}

/* ── Resource rows in item editor ── */
.res-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(26,42,69,.4)}
.res-row:last-child{border-bottom:none}
.res-name{flex:1;font-size:12px}
.res-amt{width:90px;font-family:'Space Mono',monospace;font-size:12px}

/* ── Summary highlight ── */
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}

/* ── Separator ── */
.sep{height:1px;background:var(--border);margin:4px 0 8px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:4px 0 6px}

/* ── Cloud sync ── */
.spin{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.sync-btn{font-size:15px;padding:4px 8px;min-width:32px;transition:color .2s,border-color .2s}
.cloud-modal-bg{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center
}
.cloud-modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  width:600px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:20px;
  display:flex;flex-direction:column;gap:14px
}
.cloud-modal-box h2{font-size:15px;font-weight:700;color:var(--cyan)}
.cloud-step{display:flex;gap:10px;align-items:flex-start}
.cloud-step-num{
  width:20px;height:20px;border-radius:50%;background:rgba(0,212,255,.12);
  border:1px solid rgba(0,212,255,.3);color:var(--cyan);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px
}
.rules-block{
  background:var(--surface2);border:1px solid var(--border);border-radius:5px;
  padding:10px;font-size:11px;font-family:'Space Mono',monospace;
  overflow-x:auto;color:var(--text);white-space:pre;line-height:1.7
}
.sync-status-row{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:6px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2)}

@media(max-width:700px){
  .panel-layout{grid-template-columns:1fr}
  .sidebar{position:static;height:160px;border-right:none;border-bottom:1px solid var(--border)}
  header{flex-wrap:wrap;height:auto;padding:8px 12px}
}
</style>
</head>
<body>

<header>
  <div class="logo">OE <span>/</span> Tracker</div>
  <nav class="tab-nav">
    <button class="tab-btn active" id="tbtn-0" onclick="showTab(0)">🏗 Colonies</button>
    <button class="tab-btn" id="tbtn-1" onclick="showTab(1)">📋 Items</button>
    <button class="tab-btn" id="tbtn-2" onclick="showTab(2)">🏭 Production</button>
    <button class="tab-btn" id="tbtn-3" onclick="showTab(3)">🔌 API Sync</button>
    <button class="tab-btn" id="tbtn-4" onclick="showTab(4)">🔭 Surveys</button>
  </nav>
  <div class="hdr-btns">
    <button class="btn sync-btn" id="sync-btn" onclick="openCloudModal()" title="Cloud Sync">
      <span id="sync-icon">☁</span>
    </button>
    <button class="btn btn-cyan" onclick="exportData()">⬇ Export</button>
    <label class="btn btn-ghost" style="cursor:pointer">⬆ Import
      <input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
    <button class="btn btn-danger" onclick="resetData()">↺ Reset</button>
  </div>
</header>

<!-- Cloud Sync Modal -->
<div id="cloud-modal" style="display:none" class="cloud-modal-bg" onclick="if(event.target===this)closeCloudModal()">
  <div class="cloud-modal-box" id="cloud-modal-box"></div>
</div>

<!-- ═══ TAB 0: COLONIES ═══ -->
<div class="tab-panel active" id="tab-0">
  <div class="panel-layout">
    <aside class="sidebar" id="col-sidebar"></aside>
    <div class="main-scroll" id="col-main"></div>
  </div>
</div>

<!-- ═══ TAB 1: ITEMS ═══ -->
<div class="tab-panel" id="tab-1">
  <div class="panel-layout">
    <aside class="sidebar" id="items-sidebar"></aside>
    <div class="main-scroll" id="items-main"></div>
  </div>
</div>

<!-- ═══ TAB 2: PRODUCTION ═══ -->
<div class="tab-panel" id="tab-2">
  <div class="panel-layout">
    <aside class="sidebar" id="prod-sidebar"></aside>
    <div class="main-scroll" id="prod-main"></div>
  </div>
</div>

<!-- ═══ TAB 3: API INTEGRATION ═══ -->
<div class="tab-panel" id="tab-3">
  <div class="panel-layout">
    <aside class="sidebar" id="api-sidebar"></aside>
    <div class="main-scroll" id="api-main"></div>
  </div>
</div>

<!-- ═══ TAB 4: SURVEYS ═══ -->
<div class="tab-panel" id="tab-4">
  <div class="panel-layout">
    <aside class="sidebar" id="survey-sidebar"></aside>
    <div class="main-scroll" id="survey-main"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let planets      = [];  // mutable colony list (shared across tabs)
let colonyRows   = [];
let resources    = [];  // string[] — global resource registry
let items        = [];  // [{id,name,rawType,runTime,maxPerColony,resources:{}}]
let prodQueues   = {};  // {planetName: [{itemId,qty}]}
let planetStocks = {};  // {planetName: {resName: amount}}

// Colony tab UI
let colSelPlanet    = -1;
let colEditCell     = null; // {ri, pi}
let colAddingBld    = false;

// Items tab UI
let itemsMode    = 'none'; // 'none' | 'import' | 'edit'
let itemsSelId   = null;
let itemsDraft   = null;
let itemsFilter  = '';

// Production tab UI
let prodSelPlanet  = -1; // -1=none, -2=all
let prodAddingItem = false;
let prodFilter     = '';

// Surveys tab UI
let surveySelRes   = ''; // selected resource
let surveyFilter   = ''; // sidebar search
let surveys        = []; // [{cargoId, typeId, locationName, locationType, systemName, systemId, objectType, scanDate, scanCharacter, systemObjectId, resources:{name:{abundance,accessibility,rarityClassification,maxReserve}}}]

// Active tab
let activeTab = 0;

// ════════════════════════════════════════════════════════
// PERSISTENCE
// ════════════════════════════════════════════════════════
const STORAGE_KEY = 'oe-tracker-v2';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const d = JSON.parse(s);
      planets      = d.planets      || [];
      colonyRows   = d.colonyRows   || [];
      resources    = d.resources    || [];
      items        = d.items        || [];
      prodQueues   = d.prodQueues   || {};
      planetStocks = d.planetStocks || {};
      surveys      = d.surveys      || [];
    } else {
      planets=[]; colonyRows=[]; resources=[]; items=[]; prodQueues={}; planetStocks={}; surveys=[];
    }
  } catch {
    planets=[]; colonyRows=[]; resources=[]; items=[]; prodQueues={}; planetStocks={}; surveys=[];
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(
    {planets, colonyRows, resources, items, prodQueues, planetStocks, surveys}
  ));
}

function exportData() {
  const blob = new Blob([JSON.stringify({planets,colonyRows,resources,items,prodQueues,planetStocks,surveys},null,2)],
    {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'oe-tracker.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.colonyRows || d.items || d.planets) {
        if (d.planets)      planets      = d.planets;
        if (d.colonyRows)   colonyRows   = d.colonyRows;
        if (d.resources)    resources    = d.resources;
        if (d.items)        items        = d.items;
        if (d.prodQueues)   prodQueues   = d.prodQueues;
        if (d.planetStocks) planetStocks = d.planetStocks;
        if (d.surveys)      surveys      = d.surveys;
        saveState(); renderAll();
      } else { alert('Invalid file.'); }
    } catch { alert('Parse error.'); }
  };
  r.readAsText(file);
  e.target.value = '';
}

function resetData() {
  if (!confirm('Reset ALL data including colonies, items, production queues and surveys?')) return;
  planets=[]; colonyRows=[]; resources=[]; items=[];
  prodQueues={}; planetStocks={}; surveys=[]; saveState(); renderAll();
}

// ════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════
function dc(x) { return JSON.parse(JSON.stringify(x)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s) {
  if (s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Safe string for use inside single-quoted JS args within onclick="..." attributes
function jsStr(s) { return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fmtN(n) { return n.toLocaleString(); }

function regResources(resObj) {
  Object.keys(resObj||{}).forEach(name => {
    if (!resources.includes(name)) { resources.push(name); resources.sort(); }
  });
}

// ════════════════════════════════════════════════════════
// TAB MANAGEMENT
// ════════════════════════════════════════════════════════
function showTab(n) {
  activeTab = n;
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i===n));
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n));
}

function renderAll() {
  renderColSidebar(); renderColMain();
  renderItemsSidebar(); renderItemsMain();
  renderProdSidebar(); renderProdMain();
  renderApiSidebar(); renderApiMain();
  renderSurveySidebar(); renderSurveyMain();
}

// ════════════════════════════════════════════════════════
// ═══════════════ COLONY TAB ══════════════════════════
// ════════════════════════════════════════════════════════
function sType(v) {
  if (v===1) return 'built';
  if (v===0) return 'materials';
  if (v===null||v===undefined) return 'pending';
  if (typeof v==='string') return 'building';
  return 'pending';
}
function sLabel(v) {
  const t=sType(v);
  if (t==='building') return `⚙ ${v}`;
  return {built:'✓ Built',materials:'📦 Materials',pending:'— Pending'}[t]||'—';
}

function colPlanetStats(pi) {
  const c={built:0,building:0,materials:0,pending:0};
  for (const [,ss] of colonyRows) c[sType(ss[pi])]++;
  return c;
}

function renderColSidebar() {
  const el = document.getElementById('col-sidebar');
  const fil = (el.querySelector('.search-input')?.value||'').toLowerCase();

    st.building?`<span class="chip chip-building">${st.building} Building</span>`:'',
    st.materials?`<span class="chip chip-materials">${st.materials} Materials</span>`:'',

  const rows = colonyRows.map(([bname,statuses],ri)=>{
    const val=statuses[pi], type=sType(val);
    const isEdit = colEditCell && colEditCell.ri===ri && colEditCell.pi===pi;

    if (isEdit) {
      const tv = type==='building'&&typeof val==='string' ? val : nowHHMM();

        <button class="seb s-pending${type==='pending'?' act':''}" onclick="colSetStatus(${ri},${pi},'pending')">— Pending</button>

        <button class="seb s-built${type==='built'?' act':''}" onclick="colSetStatus(${ri},${pi},'built')">✓ Built</button>
        ${type==='building'?`<input class="time-inp" id="ti_${ri}_${pi}" type="text" value="${esc(val||tv)}" placeholder="HH:MM" maxlength="5"
          onchange="colSetStatus(${ri},${pi},'building',this.value)"
          onkeydown="if(event.key==='Enter')colSetStatus(${ri},${pi},'building',this.value)">`: ''}

    } else {
      statusCell=`<span class="sbadge ${type}" onclick="colOpenEdit(${ri},${pi})">${sLabel(val)}</span>`;

          <th style="text-align:right">Total</th></tr></thead>
        <tbody>${sumRows}</tbody>
      </table>

function colOpenEdit(ri,pi) {
  colEditCell = (colEditCell&&colEditCell.ri===ri&&colEditCell.pi===pi) ? null : {ri,pi};
  renderColMain();
}
function colPickBuilding(ri,pi) {
  colonyRows[ri][1][pi]=nowHHMM(); saveState(); colEditCell={ri,pi}; renderColMain();
}
function colSetStatus(ri,pi,type,time) {
  colonyRows[ri][1][pi] = type==='built'?1 : type==='materials'?0 : type==='pending'?null : (time||'??:??');
  colEditCell=null; saveState(); renderColSidebar(); renderColMain();
}

function colAddPlanet() {
  const inp = document.getElementById('new-planet-inp');
  const name = inp?.value.trim();
  if (!name) return;
  if (planets.includes(name)) { alert('Planet already in list.'); return; }
  planets.push(name);
  colonyRows.forEach(([,ss]) => ss.push(null));
  if (inp) inp.value = '';
  saveState();
  renderColSidebar();
  renderProdSidebar();
}

function colRemovePlanet(idx) {
  const name = planets[idx];
  if (!confirm(`Remove "${name}" from colonies?\nThis deletes all build queue and production data for this planet.`)) return;
  if (colSelPlanet === idx) { colSelPlanet = -1; colEditCell = null; }
  else if (colSelPlanet > idx) colSelPlanet--;
  if (prodSelPlanet === idx) { prodSelPlanet = -1; }
  else if (prodSelPlanet > idx) prodSelPlanet--;
  planets.splice(idx, 1);
  colonyRows.forEach(([,ss]) => ss.splice(idx, 1));
  delete prodQueues[name];
  delete planetStocks[name];
  saveState();
  renderColSidebar(); renderColMain();
  renderProdSidebar(); renderProdMain();
}

function colAddBuilding() {
  const inp = document.getElementById('new-bld-inp');
  const name = inp?.value.trim();
  if (!name) return;
  colonyRows.push([name, new Array(planets.length).fill(null)]);
  colAddingBld = false;
  saveState();
  renderColMain();
}

function colRemoveRow(ri) {
  if (!confirm(`Remove "${colonyRows[ri][0]}" (slot ${ri+1}) from queue for ALL planets?`)) return;
  colonyRows.splice(ri, 1);
  if (colEditCell?.ri === ri) colEditCell = null;
  else if (colEditCell?.ri > ri) colEditCell.ri--;
  saveState();
  renderColMain();
}
function nowHHMM() {
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
document.addEventListener('click',e=>{
  if (!colEditCell) return;
  if (!e.target.closest('.sed')&&!e.target.closest('.sbadge')) { colEditCell=null; renderColMain(); }
});

function itemsParseImport() {
  const ta = document.getElementById('import-ta');
  const text = ta?.value?.trim();
  if (!text) { alert('Paste game data first.'); return; }
  itemsDraft = parseGameData(text);
  itemsDraft.id = null;
  itemsMode = 'edit';
  renderItemsMain();
}

function parseGameData(text) {
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const r = {id:null, name:'', rawType:'', runTime:'', maxPerColony:null, resources:{}};
  const SHDRS = new Set(['Properties','Blueprint Properties','Resources']);
  const KKEYS = new Set(['Type','Tech Level','Ship Class','Evolution','Can Research',
    'Manufacture Run Time','Max Per Colony','Structural Integrity',
    'Unassigned Specialist Detail','_IconClass','_IconPosition',
    'Power Provided','Min Production Rating','Max Run Multiplier']);
  let i=0, inRes=false;
  while (i<lines.length) {
    const line=lines[i];
    if (line==='Resources') { inRes=true; i++; continue; }
    if (inRes) {
      if (i+1<lines.length && /^\d+$/.test(lines[i+1])) {
        r.resources[line]=parseInt(lines[i+1]); i+=2; continue;
      }
      inRes=false;
    }
    if (SHDRS.has(line)) { i++; continue; }
    if (line==='Type' && i+1<lines.length && !KKEYS.has(lines[i+1]) && !SHDRS.has(lines[i+1])) {
      r.rawType=lines[i+1]; i+=2;
    } else if (line==='Manufacture Run Time' && i+1<lines.length) {
      r.runTime=lines[i+1]; i+=2;
    } else if (line==='Max Per Colony' && i+1<lines.length && /^\d+$/.test(lines[i+1])) {
      r.maxPerColony=parseInt(lines[i+1]); i+=2;
    } else { i++; }
  }
  if (r.rawType) {
    const parts=r.rawType.split('/');
    r.name = parts[parts.length-1]
      .replace(/([a-z])([A-Z])/g,'$1 $2')
      .replace(/([A-Z]+)([A-Z][a-z])/g,'$1 $2')
      .trim();
  }
  return r;
}

function itemsAddRes() {
  const nameEl=document.getElementById('new-res-name');
  const amtEl=document.getElementById('new-res-amt');
  const name=nameEl?.value.trim();
  const amt=parseInt(amtEl?.value)||0;
  if (!name) { alert('Enter resource name.'); return; }
  if (amt<=0) { alert('Enter a positive amount.'); return; }
  if (!itemsDraft.resources) itemsDraft.resources={};
  itemsDraft.resources[name]=amt;
  if (nameEl) nameEl.value='';
  if (amtEl) amtEl.value='';
  renderItemsMain();
}

function itemsRemoveRes(rn) {
  if (itemsDraft?.resources) { delete itemsDraft.resources[rn]; renderItemsMain(); }
}

function itemsSave() {
  if (!itemsDraft) return;
  if (!itemsDraft.name.trim()) { alert('Enter item name.'); return; }
  regResources(itemsDraft.resources||{});
  // Preserve API-only fields
  const toSave = {
    id:            itemsDraft.id,
    name:          itemsDraft.name.trim(),
    apiTypeId:     itemsDraft.apiTypeId     || null,
    rawType:       itemsDraft.rawType        || null,
    runTime:       itemsDraft.runTime        || '',
    runTimeSecs:   itemsDraft.runTimeSecs    || null,
    manufactureAmt:itemsDraft.manufactureAmt || 1,
    maxPerColony:  itemsDraft.maxPerColony   || null,
    resources:     itemsDraft.resources      || {},
  };
  if (toSave.id) {
    const idx=items.findIndex(i=>i.id===toSave.id);
    if (idx>=0) items[idx]=toSave;
  } else {
    toSave.id=genId();
    items.push(toSave);
    items.sort((a,b)=>a.name.localeCompare(b.name));
  }
  itemsSelId=toSave.id;
  saveState(); renderItemsSidebar(); renderItemsMain();
}

function itemsDelete(id) {
  if (!confirm('Delete this item? It will also be removed from all production queues.')) return;
  items=items.filter(i=>i.id!==id);
  Object.keys(prodQueues).forEach(p=>{ prodQueues[p]=prodQueues[p].filter(e=>e.itemId!==id); });
  itemsSelId=null; itemsMode='none'; itemsDraft=null;
  saveState(); renderItemsSidebar(); renderItemsMain(); renderProdMain();
}

        <div class="pi-progress">aggregate view</div>
      </li>
      ${planets.filter(n=>!fil||n.toLowerCase().includes(fil)).map(name=>{
        const idx=planets.indexOf(name);
        const q=(prodQueues[name]||[]);
        const totalQty=q.reduce((a,e)=>a+e.qty,0);
        return `<li class="planet-item${prodSelPlanet===idx?' active':''}" onclick="prodSelect(${idx})">
          <div>${esc(name)}</div>
          <div class="pi-progress">${q.length?`${q.length} items · ${totalQty} runs`:'empty queue'}</div>
        </li>`;
      }).join('')}
    </ul>`;
}

function prodSelect(idx) {
  prodSelPlanet=idx; prodAddingItem=false;
  renderProdSidebar(); renderProdMain();
}

function renderProdMain() {
  const el=document.getElementById('prod-main');
  if (prodSelPlanet===-1) {
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">🏭</div><p>Select a planet or All Planets</p></div>`; return;
  }
  if (prodSelPlanet===-2) { renderProdAll(el); return; }

  const pname=planets[prodSelPlanet];
  const queue=prodQueues[pname]||[];
  const stocks=planetStocks[pname]||{};
  const needs=computeNeeds(pname);

  // Queue rows
  const qRows=queue.map(({itemId,qty},idx)=>{
    const item=items.find(i=>i.id===itemId);
    if (!item) return '';
    return `<tr>
      <td class="slot-num">${idx+1}</td>
      <td class="bname">${esc(item.name)}</td>
      <td><input type="number" class="qty-inp" value="${qty}" min="1"
        onchange="prodUpdateQty('${jsStr(pname)}',${idx},+this.value)"></td>
      <td style="font-size:11px;color:var(--dim);font-family:'Space Mono',monospace">${esc(item.runTime)||'?'}${item.manufactureAmt>1?` ×${item.manufactureAmt}`:''}</td>
      <td style="white-space:nowrap">
        <button class="icon-btn" onclick="prodMove('${jsStr(pname)}',${idx},-1)"${idx===0?' disabled':''}>↑</button>
        <button class="icon-btn" onclick="prodMove('${jsStr(pname)}',${idx},1)"${idx===queue.length-1?' disabled':''}>↓</button>
        <button class="icon-btn danger" onclick="prodRemove('${jsStr(pname)}',${idx})">×</button>
      </td>
    </tr>`;
  }).join('');

  // Add item form
  const itemOptions=items.map(it=>`<option value="${it.id}">${esc(it.name)}</option>`).join('');
  const addForm=prodAddingItem?`<tr><td colspan="5" style="padding:8px 11px">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <select id="padd-sel" class="form-inp" style="flex:2;min-width:150px">
        <option value="">Select item…</option>${itemOptions}
      </select>
      <input type="number" id="padd-qty" class="qty-inp" value="1" min="1" style="width:70px">
      <button class="btn btn-cyan" style="font-size:11px" onclick="prodConfirmAdd('${jsStr(pname)}')">Add</button>
      <button class="btn btn-ghost" style="font-size:11px" onclick="prodAddingItem=false;renderProdMain()">Cancel</button>
    </div>
  </td></tr>`:'';

  // Stock inputs — show all resources that appear in needs + existing stock
  const stockRes=Array.from(new Set([...Object.keys(needs),...Object.keys(stocks)])).sort();
  const stockResOptions=resources.map(r=>`<option value="${esc(r)}">`).join('');
  const stockRows=stockRes.map(res=>`<tr>
    <td style="font-size:12px">${esc(res)}</td>
    <td><input type="number" class="qty-inp" style="width:100px" value="${stocks[res]||0}" min="0"
      onchange="prodSetStock('${jsStr(pname)}','${jsStr(res)}',+this.value)"></td>
  </tr>`).join('');

  el.innerHTML=`<div class="main-pad">
    <div class="planet-title">${esc(pname)}</div>

    <!-- Queue -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Production Queue</span>
        ${!prodAddingItem?`<button class="btn btn-ghost" style="font-size:11px" onclick="prodAddingItem=true;renderProdMain()">+ Add Item</button>`:''}
      </div>
      ${queue.length||prodAddingItem?`
        <table class="btable">
          <thead><tr><th style="width:36px">#</th><th>Item</th><th style="width:65px">Qty</th>
            <th style="width:75px">Run Time</th><th style="width:90px"></th></tr></thead>
          <tbody>${qRows}${addForm}</tbody>
        </table>` : `
        <div style="padding:18px;text-align:center;color:var(--dim);font-size:12px">
          Empty queue. <button class="btn btn-ghost" style="font-size:11px;margin-left:8px"

      <div class="card-hdr">

      </div>
      <div style="padding:12px 14px">

          <tbody>${stockRows}</tbody>
        </table>`:''}

function renderSummaryHtml(needs, stocks) {
  const allRes=Object.keys(needs).sort();
  if (!allRes.length) return `
    <div class="card-hdr"><span class="card-title">Resource Summary</span></div>
    <div style="padding:16px;text-align:center;color:var(--dim);font-size:12px">
      Add items to the queue to see resource requirements.
    </div>`;

  let totalNeeded=0, totalMissing=0;
  const rows=allRes.map(res=>{
    const needed=needs[res]||0;
    const have=(stocks||{})[res]||0;
    const deficit=Math.max(0,needed-have);
    totalNeeded+=needed; totalMissing+=deficit;
    const cls=deficit===0?'ok':have===0?'bad':'warn';
    return `<tr>
      <td style="font-size:12px">${esc(res)}</td>
      <td class="n n-pending">${fmtN(needed)}</td>
      <td class="n n-built">${have?fmtN(have):'<span style="color:var(--dim)">—</span>'}</td>
      <td class="n ${cls}">${deficit===0?'✓':fmtN(deficit)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card-hdr">
      <span class="card-title">Resource Summary</span>
      <span style="font-size:11px;color:var(--dim)">${fmtN(totalNeeded)} total · ${fmtN(totalMissing)} to source</span>
    </div>
    <table class="stable">
      <thead><tr>
        <th>Resource</th>
        <th style="text-align:right">Needed</th>
        <th style="text-align:right">In Stock</th>
        <th style="text-align:right">To Source</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function refreshSummary(pname) {
  const el=document.getElementById('res-summary-card');
  if (!el) return;
  el.innerHTML=renderSummaryHtml(computeNeeds(pname), planetStocks[pname]||{});
}

function renderProdAll(el) {
  // Aggregate all queues
  const totalNeeds={};
  const totalStocks={};
  planets.forEach(pname=>{
    (prodQueues[pname]||[]).forEach(({itemId,qty})=>{
      const item=items.find(i=>i.id===itemId); if (!item) return;
      Object.entries(item.resources||{}).forEach(([res,amt])=>{
        totalNeeds[res]=(totalNeeds[res]||0)+amt*qty;
      });
    });
    Object.entries(planetStocks[pname]||{}).forEach(([res,amt])=>{
      totalStocks[res]=(totalStocks[res]||0)+amt;
    });
  });

  const activeQueues=planets.filter(p=>(prodQueues[p]||[]).length>0);
  const queueList=activeQueues.map(pname=>{
    const q=prodQueues[pname];
    const parts=q.map(e=>{
      const it=items.find(i=>i.id===e.itemId);
      return it?`${esc(it.name)} ×${e.qty}`:'?';
    }).join(', ');
    return `<tr>
      <td style="font-size:12px;font-weight:500;cursor:pointer;color:var(--cyan)"
        onclick="prodSelect(${planets.indexOf(pname)})">${esc(pname)}</td>
      <td style="font-size:11px;color:var(--dim)">${parts}</td>
    </tr>`;
  }).join('');

  const summaryHtml=renderSummaryHtml(totalNeeds, totalStocks);

  el.innerHTML=`<div class="main-pad">
    <div class="planet-title">All Planets — Overview</div>

    <div class="card">
      <div class="card-hdr"><span class="card-title">Active Production Queues</span></div>
      ${queueList?`<table class="btable">
        <thead><tr><th>Planet</th><th>Items in Queue</th></tr></thead>
        <tbody>${queueList}</tbody>
      </table>`:`<div style="padding:18px;text-align:center;color:var(--dim);font-size:12px">No production queues defined yet.</div>`}
    </div>

    <div class="card">${summaryHtml}</div>
  </div>`;
}

function computeNeeds(pname) {
  const needs={};
  (prodQueues[pname]||[]).forEach(({itemId,qty})=>{
    const item=items.find(i=>i.id===itemId); if (!item) return;
    Object.entries(item.resources||{}).forEach(([res,amt])=>{
      needs[res]=(needs[res]||0)+amt*qty;
    });
  });
  return needs;
}

function prodUpdateQty(pname,idx,val) {
  if (!prodQueues[pname]) return;
  prodQueues[pname][idx].qty=Math.max(1,val||1);
  saveState(); refreshSummary(pname);
}

function prodMove(pname,idx,dir) {
  const q=prodQueues[pname]; if (!q) return;
  const ni=idx+dir;
  if (ni<0||ni>=q.length) return;
  [q[idx],q[ni]]=[q[ni],q[idx]];
  saveState(); renderProdMain();
}

function prodRemove(pname,idx) {
  if (!prodQueues[pname]) return;
  prodQueues[pname].splice(idx,1);
  saveState(); renderProdSidebar(); renderProdMain();
}

function prodConfirmAdd(pname) {
  const sel=document.getElementById('padd-sel');
  const qty=parseInt(document.getElementById('padd-qty')?.value)||1;
  if (!sel?.value) { alert('Select an item first.'); return; }
  if (!prodQueues[pname]) prodQueues[pname]=[];
  prodQueues[pname].push({itemId:sel.value, qty:Math.max(1,qty)});
  prodAddingItem=false;
  saveState(); renderProdSidebar(); renderProdMain();
}

function prodSetStock(pname,res,val) {
  if (!planetStocks[pname]) planetStocks[pname]={};
  planetStocks[pname][res]=Math.max(0,val);
  saveState(); refreshSummary(pname);
}

function prodAddStockEntry(pname) {
  const nameEl=document.getElementById('new-stk-res');
  const amtEl=document.getElementById('new-stk-amt');
  const name=nameEl?.value.trim();
  const amt=parseInt(amtEl?.value)||0;
  if (!name) { alert('Enter resource name.'); return; }
  prodSetStock(pname,name,amt);
  if (!resources.includes(name)) { resources.push(name); resources.sort(); saveState(); }
  renderProdMain();
}

// ── Connect ────────────────────────────────────────────
function cloudMsg(txt, color='var(--red)') {
  const el = document.getElementById('cloud-msg');
  if (el) { el.textContent = txt; el.style.color = color; }
}

async function cloudConnect() {
  const ta  = document.getElementById('fb-conf-ta');
  const raw = ta?.value.trim();
  if (!raw) { cloudMsg('Paste your Firebase config first.'); return; }

  const conf = parseFirebaseConf(raw);
  if (!conf || !conf.apiKey || !conf.projectId) {
    cloudMsg('Invalid config — check the JSON format.'); return;
  }

  try { localStorage.setItem(CONF_KEY, JSON.stringify(conf)); } catch {}
  setCloud('loading');
  cloudMsg('Loading Firebase SDK…', 'var(--cyan)');

  try {
    await loadFirebaseSDK();
    cloudMsg('Initializing app…', 'var(--cyan)');
    initFirebaseApp(conf);

    cloudMsg('Opening Google sign-in popup…', 'var(--cyan)');
    const provider = new window.firebase.auth.GoogleAuthProvider();
    const result   = await fbAuth.signInWithPopup(provider);
    fbUser = result.user;

    setCloud('ok');
    cloudMsg('');
    renderCloudModal();

    // Try to pull from cloud; if nothing there yet, push local
    const loaded = await cloudPull(true);
    if (!loaded) await cloudPush(true);

  } catch(e) {
    setCloud('err');
    cloudMsg(`Error: ${e.message || String(e)}`);
  }
}

function loadFirebaseSDK() {
  return new Promise((resolve, reject) => {
    if (window.firebase?.firestore) { resolve(); return; }
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
    const srcs = [
      `${base}/firebase-app-compat.js`,
      `${base}/firebase-auth-compat.js`,
      `${base}/firebase-firestore-compat.js`,
    ];
    function next(i) {
      if (i >= srcs.length) { resolve(); return; }
      const s = document.createElement('script');
      s.src = srcs[i];
      s.onload  = () => next(i + 1);
      s.onerror = () => reject(new Error(`Failed to load ${srcs[i]}`));
      document.head.appendChild(s);
    }
    next(0);
  });
}

function initFirebaseApp(conf) {
  if (!fbApp) {
    fbApp = window.firebase.apps.length
      ? window.firebase.app()
      : window.firebase.initializeApp(conf);
  }
  fbAuth = window.firebase.auth(fbApp);
  fbDb   = window.firebase.firestore(fbApp);
}

function parseFirebaseConf(text) {
  try { return JSON.parse(text); } catch {}
  // Handle JS object literal (no quotes on keys)
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) return null;
  try {
    const json = m[0]
      .replace(/\/\/[^\n]*/g, '')         // strip // comments
      .replace(/,\s*([\]}])/g, '$1')      // trailing commas
      .replace(/([{,]\s*)([a-zA-Z_]\w*)\s*:/g, '$1"$2":'); // quote keys
    return JSON.parse(json);
  } catch { return null; }
}

// ── Push / Pull ────────────────────────────────────────
async function cloudPush(silent = false) {
  if (!fbDb || !fbUser) return;
  setCloud('syncing');
  try {
    const payload = JSON.stringify({planets,colonyRows,resources,items,prodQueues,planetStocks});
    await fbDb.collection('users').doc(fbUser.uid).set({
      data: payload,
      ts: window.firebase.firestore.FieldValue.serverTimestamp()
    });
    setCloud('ok');
    if (!silent) { renderCloudModal(); }
  } catch(e) {
    console.error('Cloud push failed', e);
    setCloud('err');
  }
}

async function cloudPull(silent = false) {
  if (!fbDb || !fbUser) return false;
  setCloud('syncing');
  try {
    const doc = await fbDb.collection('users').doc(fbUser.uid).get();
    if (doc.exists) {
      const d = JSON.parse(doc.data().data);
      planets      = d.planets      || [];
      colonyRows   = d.colonyRows   || [];
      resources    = d.resources    || [];
      items        = d.items        || [];
      prodQueues   = d.prodQueues   || {};
      planetStocks = d.planetStocks || {};
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {}
      setCloud('ok');
      if (!silent) { renderAll(); renderCloudModal(); }
      return true;
    }
    setCloud('ok');
    return false;
  } catch(e) {
    console.error('Cloud pull failed', e);
    setCloud('err');
    return false;
  }
}

async function cloudSignOut() {
  try { await fbAuth?.signOut(); } catch {}
  fbUser = null;
  fbApp = null; fbAuth = null; fbDb = null;
  setCloud('off');
  renderCloudModal();
}

// ── Auto-reconnect on page load ────────────────────────
async function tryReconnect() {
  const raw = (() => { try { return localStorage.getItem(CONF_KEY); } catch{return null;} })();
  if (!raw) return;
  const conf = parseFirebaseConf(raw);
  if (!conf?.apiKey) return;
  setCloud('loading');
  try {
    await loadFirebaseSDK();
    initFirebaseApp(conf);
    // Listen for auth state — resolves existing session automatically
    fbAuth.onAuthStateChanged(async user => {
      if (user && !fbUser) {
        fbUser = user;
        setCloud('ok');
        // Pull cloud data if newer than local
        await cloudPull(true);
        renderAll();
      } else if (!user) {
        setCloud('ready');
      }
    });
  } catch(e) {
    console.error('Auto-reconnect failed', e);
    setCloud('off');
  }
}

// ── Logging ─────────────────────────────────────────────
function apiLog_(msg, ok=true) {
  const ts = new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  apiLog.unshift({ts, msg, ok});

  ).join('');

// ── Token management ────────────────────────────────────
async function apiGetToken() {
  if (apiToken && Date.now() < apiToken.expiresAt - 60000) return apiToken.accessToken;
  if (!apiCreds?.clientId) throw new Error('Credentials not configured');
  const resp = await fetch(`${apiBase()}/v1/auth/token`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      clientId:  apiCreds.clientId,
      secret:    apiCreds.secret,
      grantType: 'client_credentials',
      // appId is injected by the Cloudflare Worker (never sent from browser)
    })
  });
  if (!resp.ok) { const t=await resp.text(); throw new Error(`Token exchange failed (${resp.status}): ${t.slice(0,150)}`); }
  const j = await resp.json();
  if (!j.success) throw new Error(j.returnString || 'Token exchange failed');
  apiToken = {
    accessToken: j.data.accessToken,
    expiresAt: Date.now() + j.data.expiresIn * 1000,
    scopes: j.data.scopes || [],
    characterId: j.data.characterId
  };
  return apiToken.accessToken;
}

// ── Generic API call ────────────────────────────────────
async function apiCall(path) {
  const token = await apiGetToken();
  const resp = await fetch(`${apiBase()}${path}`, {
    headers:{'Authorization':`Bearer ${token}`}
  });
  if (resp.status === 429) {
    const ra = resp.headers.get('Retry-After')||'60';
    throw new Error(`Rate limited — wait ${ra}s before retrying`);
  }
  if (!resp.ok) throw new Error(`HTTP ${resp.status} on ${path}`);
  const j = await resp.json();
  if (!j.success) throw new Error(j.returnString || `API error on ${path}`);
  return j.data;
}

const apiSleep = ms => new Promise(r => setTimeout(r, ms));

// ── Building: API status → tracker status ───────────────
function apiBldStatus(bld) {
  if (bld.constructingBuildingFinish) {
    const d = new Date(bld.constructingBuildingFinish);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return bld.buildingOnline ? 1 : null;
}

// ── Sync: Colony list ───────────────────────────────────
async function apiSyncColonies() {
  if (apiBusy) { apiLog_('Sync already in progress', false); return; }
  apiBusy = true; renderApiSidebar();
  apiLog_('Fetching colony list from API…');
  try {
    const data = await apiCall('/v1/colonies');
    const list = data.colonies || [];
    let added = 0;
    const newMap = {};
    list.forEach(c => {
      newMap[c.colonyName] = c.colonyId;
      if (!planets.includes(c.colonyName)) {
        planets.push(c.colonyName);
        colonyRows.forEach(([,ss]) => ss.push(null));
        added++;
      }
    });
    apiColMap = {...apiColMap, ...newMap};
    apiSaveMap(); saveState();
    renderColSidebar(); renderProdSidebar();
    apiLog_(`Colony list synced: ${list.length} colonies (${added} new added to tracker)`);
  } catch(e) {
    apiLog_(`Colony sync failed: ${e.message}`, false);
  }
  apiBusy = false; renderApiSidebar(); renderApiMain();
}

// ── Sync: Buildings for one colony ─────────────────────
async function apiSyncBuildingsFor(planetName) {
  const colonyId = apiColMap[planetName];
  if (!colonyId) throw new Error(`No colony ID mapped for "${planetName}" — sync colonies first`);
  const pi = planets.indexOf(planetName);
  if (pi < 0) throw new Error(`"${planetName}" not in tracker planets`);
  const data = await apiCall(`/v1/colonies/${colonyId}/buildings`);
  const apiBlds = data.buildings || [];
  // Group API buildings by name
  const byName = {};
  apiBlds.forEach(b => { (byName[b.blueprintDesignName]=byName[b.blueprintDesignName]||[]).push(b); });
  // Match to existing rows
  const usedIdx = {};
  let updated=0, added=0;
  colonyRows.forEach(([bname, statuses]) => {
    const pool = byName[bname]; if (!pool) return;
    const idx = (usedIdx[bname]=usedIdx[bname]||0);
    if (idx >= pool.length) return;
    usedIdx[bname]++;
    const ns = apiBldStatus(pool[idx]);
    if (statuses[pi] !== ns) { statuses[pi]=ns; updated++; }
  });
  // Add rows for unmatched API buildings
  Object.entries(byName).forEach(([bname, pool]) => {
    const used = usedIdx[bname]||0;
    for (let i=used; i<pool.length; i++) {
      const ss = new Array(planets.length).fill(null);
      ss[pi] = apiBldStatus(pool[i]);
      colonyRows.push([bname, ss]);
      added++;
    }
  });
  return {updated, added};
}

async function apiSyncAllBuildings() {
  if (apiBusy) { apiLog_('Sync already in progress', false); return; }
  apiBusy=true; renderApiSidebar();
  apiLog_('Syncing buildings for all mapped colonies…');
  let tot={updated:0,added:0,errors:0};
  for (const name of planets) {
    if (!apiColMap[name]) continue;
    try {
      const r = await apiSyncBuildingsFor(name);
      tot.updated+=r.updated; tot.added+=r.added;
      apiLog_(`  ${name}: ${r.updated} statuses updated, ${r.added} new rows added`);
    } catch(e) { tot.errors++; apiLog_(`  ${name}: ${e.message}`, false); }
    await apiSleep(1200);
  }
  saveState(); renderColMain();
  apiLog_(`Buildings sync done — ${tot.updated} updated, ${tot.added} added${tot.errors?`, ${tot.errors} errors`:''}`);
  apiBusy=false; renderApiSidebar();
}

// ── Sync: Warehouse for one colony ─────────────────────
async function apiSyncWarehouseFor(planetName) {
  const colonyId = apiColMap[planetName];
  if (!colonyId) throw new Error(`No colony ID for "${planetName}"`);
  const data = await apiCall(`/v1/colonies/${colonyId}/warehouse`);
  const contents = data.contents || [];
  const stock = {};
  contents.forEach(item => {
    if (item.resourceName && item.amount > 0) {
      stock[item.resourceName] = (stock[item.resourceName]||0) + item.amount;
    }
  });
  planetStocks[planetName] = stock;
  Object.keys(stock).forEach(n => { if (!resources.includes(n)) { resources.push(n); resources.sort(); } });
  return {items: Object.keys(stock).length};
}

async function apiSyncColony(planetName) {

// ── Helpers ─────────────────────────────────────────────
function formatRunTime(seconds) {
  if (!seconds) return '?';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}

// ── Sync: Blueprints ────────────────────────────────────
// Flow: locations(Bp) → location detail(Bp) → blueprint detail
// Deduplicates by typeId so each blueprint type is fetched once
async function apiSyncBlueprints() {
  if (apiBusy) { apiLog_('Sync already in progress', false); return; }
  const connected = !!(apiToken && Date.now() < apiToken.expiresAt - 5000);
  if (!connected) { try { await apiGetToken(); } catch(e) { apiLog_(`Not connected: ${e.message}`, false); return; } }
  apiBusy = true; renderApiSidebar(); renderItemsSidebar();
  apiLog_('Blueprint sync: fetching locations…');

  try {
    const locsData = await apiCall('/v1/assets/locations?type=Bp');
    const locs = locsData.locations || [];
    apiLog_(`Found ${locs.length} location(s) with blueprints`);

    const seenTypeIds = new Set();   // skip duplicates of same blueprint type
    let fetched=0, skipped=0, errors=0;

    for (const loc of locs) {
      await apiSleep(1200);
      let cargo = [];
      try {
        const locDetail = await apiCall(
          `/v1/assets/locations/${loc.locationId}?locationType=${encodeURIComponent(loc.locationType)}&type=Bp`
        );
        cargo = (locDetail.cargo || []).filter(c => c.typeC === 'Bp');
      } catch(e) {
        apiLog_(`  Location "${loc.locationName}" error: ${e.message}`, false);
        errors++; continue;
      }

      for (const bpItem of cargo) {
        if (seenTypeIds.has(bpItem.typeId)) { skipped++; continue; }
        seenTypeIds.add(bpItem.typeId);
        await apiSleep(1200);
        try {
          const bpData  = await apiCall(`/v1/assets/blueprints/${bpItem.id}`);
          const bp      = bpData.blueprint;
          const resMap  = {};
          (bpData.resourcesRequired || []).forEach(r => { resMap[r.resourceName] = r.resourceAmount; });

          // Try to extract Max Per Colony from blueprintProperties
          let maxPerColony = null;
          (bpData.blueprintProperties || []).forEach(p => {
            if (/max.*colony/i.test(p.propertyName) || /max.*colony/i.test(p.friendlyPropertyName||''))
              maxPerColony = Math.round(p.propertyValue);
          });

          regResources(resMap);

          const existing = items.findIndex(i => i.apiTypeId === bp.typeId);
          const item = {
            id:               existing >= 0 ? items[existing].id : genId(),
            name:             bp.name,
            apiTypeId:        bp.typeId,
            runTime:          formatRunTime(bp.manufactureTime),
            runTimeSecs:      bp.manufactureTime,
            manufactureAmt:   bp.manufactureAmount || 1,
            maxPerColony,
            resources:        resMap,
          };

          if (existing >= 0) items[existing] = item;
          else items.push(item);

          apiLog_(`  ${bp.name} — ${formatRunTime(bp.manufactureTime)}, ${Object.keys(resMap).length} resources`);
          fetched++;
        } catch(e) {
          apiLog_(`  Blueprint id ${bpItem.id} error: ${e.message}`, false);
          errors++;
        }
      }
    }

    items.sort((a,b) => a.name.localeCompare(b.name));
    saveState();
    renderItemsSidebar(); renderItemsMain();
    apiLog_(`Blueprints done — ${fetched} synced, ${skipped} deduped${errors ? `, ${errors} errors` : ' ✓'}`);
  } catch(e) {
    apiLog_(`Blueprint sync failed: ${e.message}`, false);
  }
  apiBusy = false; renderApiSidebar(); renderItemsSidebar();
}

// ── API sync ───────────────────────────────────────────
async function apiSyncSurveys() {
  if (apiBusy) { apiLog_('Sync already in progress', false); return; }
  const connected = !!(apiToken && Date.now() < apiToken.expiresAt - 5000);
  if (!connected) { try { await apiGetToken(); } catch(e) { apiLog_(`Not connected: ${e.message}`, false); return; } }
  apiBusy = true; renderApiSidebar();
  apiLog_('Survey sync: fetching locations…');
  try {
    const locsData = await apiCall('/v1/assets/locations?type=Sc');
    const locs = locsData.locations || [];
    apiLog_(`Found ${locs.length} location(s) with survey reports`);

    const seenCargoIds = new Set(surveys.map(s => s.cargoId));
    let fetched=0, skipped=0, errors=0;

    for (const loc of locs) {
      await apiSleep(1200);
      let cargo = [];
      try {
        const locDetail = await apiCall(
          `/v1/assets/locations/${loc.locationId}?locationType=${encodeURIComponent(loc.locationType)}&type=Sc`
        );
        cargo = (locDetail.cargo || []).filter(c => c.typeC === 'Sc');
      } catch(e) { apiLog_(`  Location "${loc.locationName}" error: ${e.message}`, false); errors++; continue; }

      for (const scItem of cargo) {
        if (seenCargoIds.has(scItem.id)) { skipped++; continue; }
        seenCargoIds.add(scItem.id);
        await apiSleep(1200);
        try {
          const svData = await apiCall(`/v1/assets/surveys/${scItem.id}`);
          const resMap = {};
          (svData.resources || []).forEach(r => {
            resMap[r.resourceName] = {
              abundance:            r.abundance,
              accessibility:        r.accessibility,
              rarityClassification: r.rarityClassification || '',
              maxReserve:           r.maxReserve || null,
            };
          });
          surveys.push({
            cargoId:        scItem.id,
            typeId:         scItem.typeId,
            locationName:   loc.locationName,
            locationType:   loc.locationType,
            systemName:     loc.systemName,
            systemId:       loc.systemId,
            objectType:     svData.objectType || '',
            scanDate:       svData.scanDate   || '',
            scanCharacter:  svData.scanCharacter || '',
            systemObjectId: svData.systemObjectId || 0,
            resources:      resMap,
          });
          const rCount = Object.keys(resMap).length;
          apiLog_(`  ${loc.locationName} (${svData.objectType||'?'}): ${rCount} resources`);
          fetched++;
        } catch(e) { apiLog_(`  Survey #${scItem.id} error: ${e.message}`, false); errors++; }
      }
    }
    saveState(); renderSurveySidebar(); renderSurveyMain();
    apiLog_(`Survey sync done — ${fetched} new, ${skipped} already cached${errors?`, ${errors} errors`:' ✓'}`);
  } catch(e) { apiLog_(`Survey sync failed: ${e.message}`, false); }
  apiBusy = false; renderApiSidebar();
}

// ── Helpers ────────────────────────────────────────────
function surveyAllResources() {
  const s = new Set();
  surveys.forEach(sv => Object.keys(sv.resources).forEach(r => s.add(r)));
  return [...s].sort();
}

function rarityColor(r) {
  const m = (r||'').toLowerCase();
  if (m.includes('ultra'))  return 'var(--red)';
  if (m.includes('very'))   return 'var(--cyan)';
  if (m.includes('rare'))   return 'var(--violet)';
  if (m.includes('uncommon')) return 'var(--amber)';
  return 'var(--dim)';
}

function miningScore(r) { return Math.round(r.abundance * r.accessibility); }

function accessPct(a) { return Math.round(a * 100); }

function objectTypeIcon(t) {
  const m = (t||'').toLowerCase();
  if (m.includes('asteroid')) return '🪨';
  if (m.includes('moon'))     return '🌙';
  if (m.includes('planet'))   return '🌍';
  if (m.includes('gas'))      return '🌀';
  return '⚫';
}

function fmtScanDate(d) {
  if (!d) return '?';
  try { return new Date(d).toLocaleDateString('pl-PL'); } catch { return d.slice(0,10); }
}

// ── Render: Sidebar ─────────────────────────────────────
function renderSurveySidebar() {
  const el = document.getElementById('survey-sidebar');
  if (!el) return;

  const allRes = surveyAllResources();
  const fil    = surveyFilter.toLowerCase();
  const filtered = allRes.filter(r => r.toLowerCase().includes(fil));

  // Per-resource: how many surveys have it + best score
  const resStats = {};
  allRes.forEach(r => {
    let best=0, count=0;
    surveys.forEach(sv => {
      if (sv.resources[r]) { count++; const sc=miningScore(sv.resources[r]); if(sc>best) best=sc; }
    });
    resStats[r] = {count, best};
  });

  el.innerHTML = `
    <div style="margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:11px;color:var(--dim)">${surveys.length} survey${surveys.length!==1?'s':''} cached</span>
      <button class="btn btn-ghost" style="font-size:10px;padding:2px 7px"
        onclick="if(confirm('Clear all cached surveys?')){surveys=[];saveState();renderSurveySidebar();renderSurveyMain()}">
        Clear</button>
    </div>
    <input class="search-input" type="text" placeholder="Search resource…"
      value="${esc(surveyFilter)}" oninput="surveyFilter=this.value;renderSurveySidebar()">
    ${!filtered.length ? `<div style="font-size:12px;color:var(--dim);padding:8px">No resources found</div>` : ''}
    <ul class="planet-list">${filtered.map(r => {
      const st = resStats[r];
      const active = surveySelRes===r;
      return `<li class="planet-item${active?' active':''}" onclick="surveySelRes='${jsStr(r)}';renderSurveyMain();renderSurveySidebar()">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r)}</div>
        <div class="pi-progress">${st.count} location${st.count!==1?'s':''} · best score ${fmtN(st.best)}</div>
      </li>`;
    }).join('')}</ul>
    ${!surveyFilter && surveys.length===0 ? `
      <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:5px;font-size:11px;color:var(--dim);line-height:1.7">
        Sync survey reports from the <b style="color:var(--text)">🔌 API Sync</b> tab to populate this list.
      </div>` : ''}`;
}

// ── Render: Main ────────────────────────────────────────
function renderSurveyMain() {
  const el = document.getElementById('survey-main');
  if (!el) return;

  // ── Overview (no resource selected) ──
  if (!surveySelRes) {
    if (!surveys.length) {
      el.innerHTML=`<div class="empty-state"><div class="empty-icon">🔭</div>
        <p>No survey reports cached yet</p>
        <p style="font-size:12px;margin-top:6px">Use <b>🔌 API Sync → Sync Surveys</b> to import your survey reports</p></div>`;
      return;
    }
    // Summary overview
    const byType = {};
    surveys.forEach(sv => { byType[sv.objectType]=(byType[sv.objectType]||0)+1; });
    const typeRows = Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
      `<tr><td>${objectTypeIcon(t)} ${esc(t)||'Unknown'}</td><td class="n">${c}</td></tr>`).join('');

    // Top 10 resources by max score
    const allRes = surveyAllResources();
    const ranked = allRes.map(r => {
      let best=0, bestLoc='', bestRarity='';
      surveys.forEach(sv => {
        if (sv.resources[r]) {
          const sc=miningScore(sv.resources[r]);
          if(sc>best){best=sc;bestLoc=sv.locationName;bestRarity=sv.resources[r].rarityClassification||'';}
        }
      });
      return {r, best, bestLoc, bestRarity};
    }).sort((a,b)=>b.best-a.best).slice(0,15);

    const topRows = ranked.map(({r,best,bestLoc,bestRarity})=>`
      <tr style="cursor:pointer" onclick="surveySelRes='${jsStr(r)}';renderSurveyMain();renderSurveySidebar()">
        <td style="font-size:12px;color:var(--cyan)">${esc(r)}</td>
        <td style="font-size:11px;color:var(--dim)">${esc(bestLoc)}</td>
        <td class="n n-built">${fmtN(best)}</td>
        <td style="font-size:11px" style="color:${rarityColor(bestRarity)}">${esc(bestRarity)}</td>
      </tr>`).join('');

    el.innerHTML=`<div class="main-pad">
      <div style="font-size:20px;font-weight:700;color:var(--cyan)">Survey Overview</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="card">
          <div class="card-hdr"><span class="card-title">By Object Type</span></div>
          <table class="btable"><tbody>${typeRows}</tbody></table>
        </div>
        <div class="card">
          <div class="card-hdr"><span class="card-title">Summary</span></div>
          <div style="padding:12px;display:flex;flex-direction:column;gap:6px">
            <div style="font-size:13px">${surveys.length} survey reports</div>
            <div style="font-size:12px;color:var(--dim)">${allRes.length} unique resources</div>
            <div style="font-size:12px;color:var(--dim)">${[...new Set(surveys.map(s=>s.systemName))].length} star systems</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Top Resources by Mining Score (abundance × accessibility) — click to explore</span></div>
        <table class="stable">
          <thead><tr><th>Resource</th><th>Best Location</th><th style="text-align:right">Score</th><th>Rarity</th></tr></thead>
          <tbody>${topRows}</tbody>
        </table>
      </div>
    </div>`;
    return;
  }

  // ── Resource detail view ──
  const res = surveySelRes;
  // Collect all surveys that have this resource
  const hits = surveys
    .filter(sv => sv.resources[res])
    .map(sv => {
      const rd = sv.resources[res];
      return {...sv, rd, score: miningScore(rd)};
    })
    .sort((a,b) => b.score - a.score);

  if (!hits.length) {
    el.innerHTML=`<div class="empty-state"><p>No surveys with <b>${esc(res)}</b></p></div>`;
    return;
  }

  // Compute stats
  const maxScore  = hits[0].score;
  const maxAbund  = Math.max(...hits.map(h=>h.rd.abundance));
  const maxAccess = Math.max(...hits.map(h=>h.rd.accessibility));
  const rarity    = hits[0].rd.rarityClassification;

  const rows = hits.map((h, i) => {
    const pctScore   = maxScore  > 0 ? h.score / maxScore            : 0;
    const pctAbund   = maxAbund  > 0 ? h.rd.abundance / maxAbund     : 0;
    const pctAccess  = maxAccess > 0 ? h.rd.accessibility / maxAccess: 0;
    const barColor   = pctScore>0.66?'var(--green)':pctScore>0.33?'var(--amber)':'var(--dim)';

    return `<tr>
      <td style="font-size:12px;font-weight:${i<3?700:400};padding:7px 10px;min-width:130px">
        ${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${objectTypeIcon(h.objectType)} ${esc(h.locationName)}
      </td>
      <td style="font-size:11px;color:var(--dim);padding:7px 10px">${esc(h.systemName)}</td>
      <td style="font-size:11px;color:var(--dim);padding:7px 10px">${esc(h.objectType)}</td>
      <td style="padding:7px 10px">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:60px;height:6px;background:var(--surface2);border-radius:3px;flex-shrink:0">
            <div style="width:${Math.round(pctScore*100)}%;height:100%;background:${barColor};border-radius:3px"></div>
          </div>
          <span style="font-family:'Space Mono',monospace;font-size:11px;color:${barColor}">${fmtN(h.score)}</span>
        </div>
      </td>
      <td style="font-family:'Space Mono',monospace;font-size:11px;padding:7px 10px">
        <span title="Abundance">${fmtN(h.rd.abundance)}</span>
      </td>
      <td style="font-family:'Space Mono',monospace;font-size:11px;padding:7px 10px">
        <span title="Accessibility" style="color:${accessPct(h.rd.accessibility)>66?'var(--green)':accessPct(h.rd.accessibility)>33?'var(--amber)':'var(--red)'}">
          ${accessPct(h.rd.accessibility)}%
        </span>
      </td>
      <td style="font-size:11px;padding:7px 10px;color:${rarityColor(h.rd.rarityClassification)}">
        ${esc(h.rd.rarityClassification||'?')}
      </td>
      <td style="font-family:'Space Mono',monospace;font-size:10px;color:var(--dim);padding:7px 10px">
        ${h.rd.maxReserve ? fmtN(h.rd.maxReserve) : '—'}
      </td>
      <td style="font-size:10px;color:var(--dim);padding:7px 10px;white-space:nowrap">${fmtScanDate(h.scanDate)}</td>
    </tr>`;
  }).join('');

  el.innerHTML=`<div class="main-pad">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:20px;font-weight:700;color:var(--cyan)">${esc(res)}</div>
        <div style="font-size:12px;color:${rarityColor(rarity)};margin-top:2px">${esc(rarity)}</div>
      </div>
      <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">
        <span class="chip chip-built">${hits.length} location${hits.length!==1?'s':''}</span>
        <span class="chip chip-pending">best score ${fmtN(maxScore)}</span>
        <button class="btn btn-ghost" style="font-size:11px" onclick="surveySelRes='';renderSurveyMain()">← All resources</button>
      </div>
    </div>

    <div class="card" style="overflow-x:auto">
      <div class="card-hdr">
        <span class="card-title">Locations sorted by Mining Score (abundance × accessibility)</span>
        <span style="font-size:11px;color:var(--dim)">🥇🥈🥉 = top 3</span>
      </div>
      <table class="btable" style="min-width:700px">
        <thead><tr>
          <th>Location</th><th>System</th><th>Type</th>
          <th style="width:140px">Score</th>
          <th style="width:90px">Abundance</th>
          <th style="width:90px">Access.</th>
          <th style="width:100px">Rarity</th>
          <th style="width:90px">Max Res.</th>
          <th style="width:80px">Scanned</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    ${hits.length > 1 ? `
    <div class="card">
      <div class="card-hdr"><span class="card-title">Abundance vs Accessibility</span></div>
      <div style="padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px">
        ${hits.slice(0,12).map(h=>{
          const pct=Math.round(h.rd.accessibility*100);
          const col=pct>66?'var(--green)':pct>33?'var(--amber)':'var(--red)';
          return `<div style="padding:8px 10px;background:var(--surface2);border-radius:5px;border:1px solid var(--border)">
            <div style="font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(h.locationName)}">${objectTypeIcon(h.objectType)} ${esc(h.locationName)}</div>
            <div style="margin-top:6px;display:flex;justify-content:space-between;font-size:10px">
              <span style="color:var(--dim)">Abd:</span><span style="font-family:'Space Mono',monospace">${fmtN(h.rd.abundance)}</span>
            </div>
            <div style="height:4px;background:var(--border);border-radius:2px;margin:4px 0">
              <div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div>
            </div>
            <div style="font-size:10px;color:${col};text-align:right">${pct}% access</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
loadState();
apiLoadCreds();
renderColSidebar(); renderColMain();
renderItemsSidebar(); renderItemsMain();
renderProdSidebar(); renderProdMain();
renderApiSidebar(); renderApiMain();
renderSurveySidebar(); renderSurveyMain();
tryReconnect();
</script>
